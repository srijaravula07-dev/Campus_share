{% extends 'base.html' %}
{% block title %}New Request - Campus Share{% endblock %}
{% block content %}

<h1>Request a Resource</h1>
<p class="page-sub">Tell your batch what you're looking for.</p>

<form method="post" class="form-box">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Title</label>
    <input type="text" name="title" placeholder="e.g. Notes for Unit 3 of CN" required>

    <label>Description <span style="text-transform:none; font-weight:400;">(optional)</span></label>
    <textarea name="description" rows="3" placeholder="Any extra detail about what you need..."></textarea>

    <label>Subject</label>
    <input type="text" name="subject" placeholder="e.g. Computer Networks" required>

    <label>Year</label>
    <select name="year" required>
        <option value="" disabled selected>Select Year</option>
        {% for y in years %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
    </select>

    <label>Branch</label>
    <select name="branch" required>
        <option value="" disabled selected>Select Branch</option>
        {% for b in branches %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
    </select>

    <button type="submit">Post Request</button>
</form>

{% endblock %}
